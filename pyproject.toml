[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital-readmission-api"
version = "1.0.0"
description = "ML service that predicts 30-day hospital readmission risk, trained on the UCI Diabetes 130-US hospitals dataset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sai Rajiv Nagula" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/readmission"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=readmission --cov-report=term-missing"
